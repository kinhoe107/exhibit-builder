allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  # The package's post-install action is fundraising telemetry only; the
  # bundled browser worker and WASM files require no build script.
  tesseract.js: false
minimumReleaseAgeExclude:
  - undici@7.28.0 || 7.29.0
  - fast-uri@3.1.5
  - brace-expansion@1.1.18 || 2.1.4 || 5.0.9
  - js-yaml@4.3.1
  - nanoid@3.3.17
  - electron@43.4.0
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
overrides:
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
